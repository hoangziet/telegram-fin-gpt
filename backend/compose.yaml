services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: fingpt
      POSTGRES_USER: fingpt
      POSTGRES_PASSWORD: fingpt
    ports:
      - "${FINGPT_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fingpt -d fingpt"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
