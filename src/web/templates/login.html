<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinGPT - Đăng nhập</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>

<body
    class="bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 min-h-screen flex items-center justify-center">
    <div class="glass rounded-3xl p-8 w-full max-w-md mx-4">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-white mb-2">💰 FinGPT</h1>
            <p class="text-slate-400">Đăng nhập để xem Dashboard</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <div>
                <label class="block text-slate-300 text-sm font-medium mb-2">
                    User ID
                </label>
                <input type="text" id="user_id" required placeholder="Nhập Telegram User ID" class="w-full px-4 py-3 rounded-xl bg-slate-800/50 border border-slate-600 
                              text-white placeholder-slate-500
                              focus:border-purple-500 focus:ring-2 focus:ring-purple-500/20 focus:outline-none
                              transition-all duration-200">
                <p class="text-slate-500 text-xs mt-1">Gửi /dashboard trên Telegram để lấy</p>
            </div>

            <div>
                <label class="block text-slate-300 text-sm font-medium mb-2">
                    Token
                </label>
                <input type="text" id="token" required placeholder="Nhập token" class="w-full px-4 py-3 rounded-xl bg-slate-800/50 border border-slate-600 
                              text-white placeholder-slate-500
                              focus:border-purple-500 focus:ring-2 focus:ring-purple-500/20 focus:outline-none
                              transition-all duration-200">
                <p class="text-slate-500 text-xs mt-1">Token từ link bot gửi</p>
            </div>

            <button type="submit" class="w-full py-3 px-4 bg-gradient-to-r from-purple-600 to-pink-600 
                           hover:from-purple-500 hover:to-pink-500
                           text-white font-semibold rounded-xl
                           transform hover:scale-[1.02] transition-all duration-200
                           shadow-lg hover:shadow-purple-500/25">
                🚀 Xem Dashboard
            </button>
        </form>

        <div id="error"
            class="hidden mt-4 p-3 bg-red-500/20 border border-red-500/50 rounded-xl text-red-300 text-sm text-center">
        </div>

        <div class="mt-8 pt-6 border-t border-slate-700/50 text-center">
            <p class="text-slate-500 text-sm">
                Chưa có thông tin?
                <span class="text-purple-400">Gửi /dashboard cho bot Telegram</span>
            </p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const userId = document.getElementById('user_id').value.trim();
            const token = document.getElementById('token').value.trim();
            const errorDiv = document.getElementById('error');

            if (!userId || !token) {
                errorDiv.textContent = '❌ Vui lòng nhập đầy đủ thông tin';
                errorDiv.classList.remove('hidden');
                return;
            }

            // Redirect to dashboard
            window.location.href = `/dashboard?user_id=${userId}&token=${token}`;
        });

        // Auto-fill from URL params (if any)
        const params = new URLSearchParams(window.location.search);
        if (params.get('user_id')) {
            document.getElementById('user_id').value = params.get('user_id');
        }
        if (params.get('token')) {
            document.getElementById('token').value = params.get('token');
        }
        if (params.get('error')) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = '❌ ' + params.get('error');
            errorDiv.classList.remove('hidden');
        }
    </script>
</body>

</html>
