<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinGPT - Đăng nhập / Đăng ký</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
        .tab-active { border-bottom: 2px solid #a855f7; color: white !important; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 min-h-screen flex items-center justify-center">
    <div class="glass rounded-3xl p-8 w-full max-w-md mx-4">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-white mb-2">💰 FinGPT Platform</h1>
            <p class="text-slate-400">Quản lý chi tiêu đa Bot</p>
        </div>

        <!-- Render flash error -->
        {% if error %}
        <div class="mb-4 p-3 bg-red-500/20 border border-red-500/50 rounded-xl text-red-300 text-sm text-center">
            ❌ {{ error }}
        </div>
        {% endif %}

        <div class="flex border-b border-slate-700 mb-6">
            <button onclick="switchTab('login')" id="tab-login" class="flex-1 py-3 text-sm font-medium text-slate-400 tab-active transition-all">Đăng nhập</button>
            <button onclick="switchTab('register')" id="tab-register" class="flex-1 py-3 text-sm font-medium text-slate-400 transition-all">Đăng ký mới</button>
        </div>

        <form method="POST" id="authForm" class="space-y-6">
            <input type="hidden" name="action" id="form-action" value="login">
            
            <div>
                <label class="block text-slate-300 text-sm font-medium mb-2">Tên đăng nhập (Username)</label>
                <input type="text" name="username" required placeholder="Tên đăng nhập" 
                       class="w-full px-4 py-3 rounded-xl bg-slate-800/50 border border-slate-600 text-white placeholder-slate-500 focus:border-purple-500 focus:ring-2 focus:ring-purple-500/20 focus:outline-none transition-all">
            </div>

            <div>
                <label class="block text-slate-300 text-sm font-medium mb-2">Mật khẩu (Password)</label>
                <input type="password" name="password" required placeholder="Mật khẩu" 
                       class="w-full px-4 py-3 rounded-xl bg-slate-800/50 border border-slate-600 text-white placeholder-slate-500 focus:border-purple-500 focus:ring-2 focus:ring-purple-500/20 focus:outline-none transition-all">
            </div>

            <button type="submit" id="submit-btn" class="w-full py-3 px-4 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-semibold rounded-xl transform hover:scale-[1.02] transition-all duration-200 shadow-lg hover:shadow-purple-500/25">
                🚀 Đăng nhập
            </button>
        </form>
    </div>

    <script>
        function switchTab(tab) {
            document.getElementById('form-action').value = tab;
            if (tab === 'login') {
                document.getElementById('tab-login').classList.add('tab-active');
                document.getElementById('tab-register').classList.remove('tab-active');
                document.getElementById('submit-btn').innerHTML = '🚀 Đăng nhập';
            } else {
                document.getElementById('tab-register').classList.add('tab-active');
                document.getElementById('tab-login').classList.remove('tab-active');
                document.getElementById('submit-btn').innerHTML = '✨ Tạo tài khoản';
            }
        }
    </script>
</body>
</html>
