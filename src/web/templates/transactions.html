{% extends "layout.html" %}

{% block title %}FinGPT - Transactions{% endblock %}

{% block content %}
<div class="glass rounded-2xl p-6">
    <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
        <h2 class="text-xl font-bold flex items-center gap-2">
            <i data-lucide="list" class="w-6 h-6 text-purple-400"></i>
            Lịch sử giao dịch
        </h2>

        <div class="flex gap-2 w-full md:w-auto">
            <input type="text" id="search-input" placeholder="Tìm kiếm..."
                class="bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-purple-500 w-full md:w-64">
            <select id="filter-days"
                class="bg-slate-800 border-slate-700 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-purple-500">
                <option value="30">30 ngày</option>
                <option value="90">3 tháng</option>
                <option value="365">1 năm</option>
                <option value="9999">Tất cả</option>
            </select>
        </div>
    </div>

    <div class="overflow-x-auto">
        <table class="w-full">
            <thead>
                <tr class="text-slate-400 text-left border-b border-slate-700/50 text-sm">
                    <th class="pb-3 pl-2 w-32">Ngày</th>
                    <th class="pb-3 w-40">Danh mục</th>
                    <th class="pb-3">Ghi chú</th>
                    <th class="pb-3 text-right pr-2 w-32">Số tiền</th>
                </tr>
            </thead>
            <tbody id="tx-table-full" class="text-sm">
                <!-- Loading state -->
                <tr>
                    <td colspan="4" class="text-center py-8 text-slate-500">Đang tải dữ liệu...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Pagination (Simple load more for now or just limit) -->
    <div class="mt-4 text-center text-xs text-slate-500" id="record-count"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const categoryIcons = {
        "Ăn uống": "🍜", "Di chuyển": "🚗", "Mua sắm": "🛒",
        "Giải trí": "🎮", "Hóa đơn": "🏠", "Sức khỏe": "💊",
        "Học tập": "📚", "Quà tặng": "🎁", "Khác": "❓",
        "Lương": "💼", "Thưởng": "🎯", "Thu khác": "💰"
    };

    let debounceTimer;
    document.getElementById('search-input').addEventListener('input', (e) => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => loadTransactions(), 300);
    });

    document.getElementById('filter-days').addEventListener('change', loadTransactions);

    async function loadTransactions() {
        const days = document.getElementById('filter-days').value;
        const keyword = document.getElementById('search-input').value; // Client-side filter or API?
        // Currently API supports keyword.

        // Use the existing transaction API
        // NOTE: The API might need to be updated to support keyword searching if it doesn't already.
        // Looking at previous code, `find` method supports keyword.
        // Route `/api/transactions` calls `db.get_history` which calls `find` but with limit.
        // Check route implementation... uses `db.get_history(user_id, limit=50)`.
        // I might need to update the API to accept keyword and limit.

        let url = `/api/transactions?user_id=${USER_ID}&token=${TOKEN}&limit=100&days=${days}`;
        // If API doesn't support keyword yet, we implement client-side filtering or update API.
        // Let's update API later. For now, fetch and client-side filter if needed, 
        // or just fetch general list.

        const res = await fetch(url);
        const data = await res.json();

        // Client side filtering for keyword if API doesn't support it yet via query param
        const filtered = keyword
            ? data.filter(tx => tx.note && tx.note.toLowerCase().includes(keyword.toLowerCase()))
            : data;

        renderTable(filtered);
        document.getElementById('record-count').textContent = `Hiển thị ${filtered.length} giao dịch`;
    }

    function renderTable(txs) {
        const tbody = document.getElementById('tx-table-full');

        if (txs.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" class="text-center py-8 text-slate-500">Không tìm thấy giao dịch nào</td></tr>`;
            return;
        }

        tbody.innerHTML = txs.map(tx => `
            <tr class="border-b border-slate-700/50 hover:bg-slate-800/50 transition group">
                <td class="py-3 pl-2">${tx.date}</td>
                <td class="py-3">
                    <span class="inline-flex items-center gap-1 px-2 py-1 rounded-full text-xs font-medium bg-slate-800 border border-slate-700 group-hover:border-slate-600 transition">
                        ${categoryIcons[tx.category] || '❓'} ${tx.category}
                    </span>
                </td>
                <td class="py-3 text-slate-300">${tx.note || '-'}</td>
                <td class="py-3 text-right pr-2 font-medium ${tx.type === 'thu' ? 'text-green-400' : 'text-red-400'}">
                    ${tx.type === 'thu' ? '+' : '-'}${formatMoney(tx.amount)}
                </td>
            </tr>
        `).join('');
    }

    loadTransactions();
</script>
{% endblock %}
