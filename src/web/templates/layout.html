<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FinGPT{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-link {
            transition: all 0.2s;
        }

        .nav-link:hover,
        .nav-link.active {
            background: rgba(139, 92, 246, 0.2);
            color: #d8b4fe;
        }
    </style>
</head>

<body class="bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 min-h-screen text-white">
    <div class="container mx-auto px-4 py-6 max-w-6xl">
        <!-- Navigation -->
        <nav class="glass rounded-2xl p-4 mb-8 flex justify-between items-center sticky top-4 z-50">
            <div class="flex items-center gap-2">
                <span class="text-2xl">💰</span>
                <span
                    class="font-bold text-xl bg-gradient-to-r from-purple-400 to-pink-400 bg-clip-text text-transparent">FinGPT</span>
            </div>

            <div class="hidden md:flex gap-1" id="nav-menu">
                <a href="/dashboard"
                    class="nav-link px-4 py-2 rounded-lg flex items-center gap-2 {% if request.endpoint == 'dashboard.dashboard_page' %}active{% endif %}">
                    <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Dashboard
                </a>
                <a href="/transactions"
                    class="nav-link px-4 py-2 rounded-lg flex items-center gap-2 {% if request.endpoint == 'dashboard.transactions_page' %}active{% endif %}">
                    <i data-lucide="list" class="w-4 h-4"></i> Giao dịch
                </a>
                <a href="/settings"
                    class="nav-link px-4 py-2 rounded-lg flex items-center gap-2 {% if request.endpoint == 'dashboard.settings_page' %}active{% endif %}">
                    <i data-lucide="settings" class="w-4 h-4"></i> Cấu hình
                </a>
                <a href="/about"
                    class="nav-link px-4 py-2 rounded-lg flex items-center gap-2 {% if request.endpoint == 'dashboard.about_page' %}active{% endif %}">
                    <i data-lucide="info" class="w-4 h-4"></i> Thông tin
                </a>
            </div>

            <div class="flex gap-2">
                <a href="/logout"
                    class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 transition flex items-center gap-2 text-sm">
                    <i data-lucide="log-out" class="w-4 h-4"></i> Đăng xuất
                </a>
            </div>
        </nav>

        <!-- Content -->
        {% block content %}{% endblock %}
    </div>

    <script>
        lucide.createIcons();

        function formatMoney(amount) {
            return new Intl.NumberFormat('vi-VN').format(amount) + 'đ';
        }
    </script>
    {% block scripts %}{% endblock %}
</body>

</html>
