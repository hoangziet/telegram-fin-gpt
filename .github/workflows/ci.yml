name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Bicep CLI
        run: az bicep install --version v0.47.16
      - name: Test Azure network parameter validation
        run: python3 -m unittest discover -s infra -p 'test_*.py'
      - name: Build and lint platform and runtime templates
        run: |
          az bicep build --file infra/main.bicep --stdout >/dev/null
          az bicep lint --file infra/main.bicep
          az bicep build --file infra/apps.bicep --stdout >/dev/null
          az bicep lint --file infra/apps.bicep

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: fingpt
          POSTGRES_USER: fingpt
          POSTGRES_PASSWORD: fingpt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fingpt -d fingpt"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://fingpt:fingpt@localhost:5432/fingpt
      FINGPT_TEST_DATABASE_URL: postgresql+psycopg://fingpt:fingpt@localhost:5432/fingpt
      FIN_GPT_SECRET_KEY: ci-only-not-for-deployment-long-enough-123456
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install locked Python dependencies
        run: python -m pip install --require-hashes -r backend/requirements-dev.lock
      - name: Install backend package
        run: python -m pip install --no-deps ./backend
      - name: Lint and type check
        run: |
          ruff check backend/fingpt backend/migrations backend/tests
          ruff format --check backend/fingpt backend/migrations backend/tests
          mypy backend/fingpt backend/migrations backend/tests
      - name: Test backend
        run: pytest -q backend/tests
      - name: Verify migration upgrade and rollback
        run: |
          alembic -c backend/alembic.ini upgrade head
          alembic -c backend/alembic.ini check
          alembic -c backend/alembic.ini downgrade base
          alembic -c backend/alembic.ini upgrade head
      - name: Build combined API and web container
        run: docker build --file backend/Dockerfile --tag fingpt-api:ci .
      - name: Smoke test the built API and same-origin web app
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name fingpt-api-ci --publish 127.0.0.1:8080:8080 \
            --env FIN_GPT_SECRET_KEY=ci-only-not-for-deployment-long-enough-123456 \
            --env AUTH_COOKIE_SECURE=false \
            fingpt-api:ci >/dev/null
          trap 'docker rm --force fingpt-api-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health/live >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:8080/health/live >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/ | grep -q '<title>Where my bucks go?</title>'

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install locked web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Check web code
        working-directory: web
        run: |
          pnpm lint
          pnpm format:check
          pnpm typecheck
          pnpm build
